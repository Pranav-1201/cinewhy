name: CI

# Runs on every push and PR. This is what makes model choice irrelevant: the formatter
# normalises style, the linter and type checker reject drift, and the suite proves the
# contract still holds — regardless of which editor or assistant produced the code.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ── Known vulnerabilities (audit item B11) ─────────────────────────
      # Blocking: the environment CI just installed, i.e. what a deployed service ships.
      # Informational: the full notebook stack in requirements.txt. On 2026-09-29 it had
      # 14 of 105 pinned packages with known advisories, all with fixed releases, mostly
      # the Jupyter stack. Bumping them is its own change (it invalidates prior results),
      # so it is reported here without failing the build until that change is made.
      - name: Vulnerability audit (installed environment)
        run: |
          pip install pip-audit
          pip-audit --skip-editable

      - name: Vulnerability audit (requirements.txt, informational)
        continue-on-error: true
        run: pip-audit -r requirements.txt --no-deps --disable-pip

      # ── Lint and format ────────────────────────────────────────────────
      # `format --check` never writes; it fails if anyone committed unformatted code.
      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      # ── Types ──────────────────────────────────────────────────────────
      # A mypy run over ZERO files exits 0 and proves nothing. Assert the file count
      # before trusting the green. This exact false-green cost a previous project
      # several sessions of misplaced confidence.
      - name: Typecheck
        run: |
          set -o pipefail
          mypy 2>&1 | tee mypy.out
          if ! grep -qE 'Success: no issues found in [1-9][0-9]* source file' mypy.out; then
            echo "::error::mypy did not report a non-zero source-file count — refusing to pass"
            exit 1
          fi

      # ── Tests ──────────────────────────────────────────────────────────
      # Same reasoning: a suite that collects 0 tests exits 0. Require a real count.
      - name: Tests
        run: |
          set -o pipefail
          pytest --cov --cov-report=term-missing --junitxml=junit.xml | tee pytest.out
          if ! grep -qE '[1-9][0-9]* passed' pytest.out; then
            echo "::error::pytest reported no passing tests — refusing to pass"
            exit 1
          fi

      # ── Repo hygiene ───────────────────────────────────────────────────
      # Notebook outputs are stripped for every notebook EXCEPT the frozen
      # legacy one.
      #
      # Movie_Sentiment_Analysis.ipynb is exempt on purpose: its committed
      # outputs are the primary evidence for the numbers the 2026-08-26 audit
      # analysed (0.8350 / 0.8330 / 0.8255 / 0.7820). Stripping them would
      # delete the record the audit's findings are checked against, and the
      # file is write-once — Phase C replaces it with real modules rather than
      # editing it, so the unreadable-diff argument does not apply.
      # The secret-leak argument is covered by the gitleaks job below, which
      # scans notebook outputs along with everything else.
      - name: Notebook outputs stripped
        run: |
          mapfile -t nbs < <(git ls-files '*.ipynb' | grep -v '^archive/legacy/Movie_Sentiment_Analysis\.ipynb$' || true)
          if [ ${#nbs[@]} -eq 0 ]; then
            echo "No non-legacy notebooks tracked — nothing to verify."
            exit 0
          fi
          echo "Verifying ${#nbs[@]} notebook(s): ${nbs[*]}"
          nbstripout --verify "${nbs[@]}"

      - name: No large files staged
        run: |
          big=$(git ls-files | xargs -I{} du -k "{}" 2>/dev/null | awk '$1 > 5120 {print $2}')
          if [ -n "$big" ]; then
            echo "::error::files over 5 MB are tracked: $big"
            exit 1
          fi

  # Builds the runtime image, boots it on a small synthetic artifact set (tests/smoke_artifacts.py),
  # and checks that a verified manifest is served and a recommendation comes back. The Dockerfile
  # cannot be built on the development machine (no Docker), so this job is what verifies it. The
  # real 365 MB artifacts are not needed to prove the image starts, so it runs on every push and
  # pull request and takes about two minutes.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Write the synthetic artifact set
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m tests.smoke_artifacts --out "$RUNNER_TEMP/smoke-artifacts"

      - name: Build image
        run: docker build -t cinewhy .

      - name: Boot and probe
        run: |
          docker run -d --name cinewhy -p 7860:7860 \
            -v "$RUNNER_TEMP/smoke-artifacts:/app/artifacts:ro" cinewhy
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:7860/health > health.json; then break; fi
            sleep 2
          done
          cat health.json
          grep -q '"manifest":"[0-9a-f]\{64\}"' health.json
          curl -fsS -X POST http://localhost:7860/recommend \
            -H 'content-type: application/json' -d '{"profile":{}}' | grep -q '"cold_start":true'
          curl -fsS http://localhost:7860/ | grep -q "CineWhy"

      - name: Container logs on failure
        if: failure()
        run: docker logs cinewhy

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
